spring.application.name=Microservice 1
server.port=8081

# Target MS2 service URL (defaults to localhost:8082, overridable by environment variable)
ms2.service.base-url=${MS2_SERVICE_BASE_URL:http://localhost:8082/}

# OAuth2 credentials for MS1 to call MS2
oauth2.client-id=legacy-app
oauth2.client-secret=cm-secret-123

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.demo.docker=INFO
logging.level.org.springframework.web.client=DEBUG